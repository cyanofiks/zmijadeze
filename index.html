<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const size = 40;
const cols = 12;
const rows = 18;

let score = 0;
let message = "";
let gameLoop;
let gameEnded = false;

let snake = [{x:6,y:9}];

let dx = 1;
let dy = 0;

let boardItems = [];

const itemTypes = [
{
    emoji:"💰",
    score:5,
    msg:"Nova afera!"
},
{
    emoji:"🏢",
    score:3,
    msg:"Dobiven natječaj!"
},
{
    emoji:"🧾",
    score:1,
    msg:"Putni nalog!"
},
{
    emoji:"💶",
    score:10,
    msg:"EU fondovi!"
},
{
    emoji:"🚓",
    score:-10,
    msg:"USKOK!"
},
{
    emoji:"📹",
    cut:3,
    msg:"Kamere!"
},
{
    emoji:"⚖️",
    gameOver:true,
    life:5000,
    msg:"Presuda!"
}
];

function randomFreeTile(){

    while(true){

        let x =
            Math.floor(Math.random()*cols);

        let y =
            Math.floor(Math.random()*rows);

        let occupied =
            snake.some(
                s=>s.x===x && s.y===y
            );

        occupied =
            occupied ||
            boardItems.some(
                i=>i.x===x && i.y===y
            );

        if(!occupied){
            return {x,y};
        }
    }
}

function spawnItem(){

    const type =
        itemTypes[
            Math.floor(
                Math.random()*
                itemTypes.length
            )
        ];

    const pos =
        randomFreeTile();

    const item = {
        ...type,
        x:pos.x,
        y:pos.y,
        born:Date.now()
    };

    boardItems.push(item);
}

for(let i=0;i<5;i++){
    spawnItem();
}

function draw(){

    ctx.fillStyle="#4aa64f";
    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    boardItems.forEach(i=>{

        ctx.font="32px Arial";

        ctx.fillText(
            i.emoji,
            i.x*size+2,
            i.y*size+32
        );
    });

    for(let i=0;i<snake.length;i++){

        const s = snake[i];

        ctx.font="32px Arial";

        if(i===0){
            ctx.fillText(
                "👔",
                s.x*size+2,
                s.y*size+32
            );
        }
        else{
            ctx.fillText(
                "💼",
                s.x*size+2,
                s.y*size+32
            );
        }
    }

    ctx.fillStyle="white";
    ctx.font="24px Arial";

    ctx.fillText(
        "Afere: "+score,
        10,
        30
    );

    ctx.font="18px Arial";

    ctx.fillText(
        message,
        10,
        58
    );

    if(gameEnded){

        ctx.fillStyle =
            "rgba(0,0,0,0.7)";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        ctx.fillStyle="white";
        ctx.font="40px Arial";
        ctx.textAlign="center";

        ctx.fillText(
            message,
            canvas.width/2,
            canvas.height/2
        );

        ctx.textAlign="left";
    }
}

function update(){

    boardItems =
        boardItems.filter(i=>{

            if(
                i.life &&
                Date.now()-i.born >
                i.life
            ){
                return false;
            }

            return true;
        });

    while(
        boardItems.length < 5
    ){
        spawnItem();
    }

    const head = {
        x:snake[0].x + dx,
        y:snake[0].y + dy
    };

    if(
        head.x<0 ||
        head.y<0 ||
        head.x>=cols ||
        head.y>=rows
    ){
        endGame(
            "💥 Udar u zid!"
        );
        return;
    }

    for(let s of snake){

        if(
            head.x===s.x &&
            head.y===s.y
        ){
            endGame(
                "💥 Sam sebe!"
            );
            return;
        }
    }

    snake.unshift(head);

    let eaten =
        boardItems.findIndex(
            i=>
                i.x===head.x &&
                i.y===head.y
        );

    if(eaten !== -1){

        const item =
            boardItems[eaten];

        message =
            item.msg;

        if(item.gameOver){
            endGame(
                "⚖️ PRESUDA!"
            );
            return;
        }

        if(item.score){

            score += item.score;

            if(score < 0){
                score = 0;
            }
        }

        if(item.cut){

            for(
                let i=0;
                i<item.cut;
                i++
            ){

                if(
                    snake.length > 1
                ){
                    snake.pop();
                }
            }
        }

        boardItems.splice(
            eaten,
            1
        );

        spawnItem();

        if(score >= 100){

            endGame(
                "🏆 APSOLUTNA VEĆINA!"
            );

            return;
        }
    }
    else{
        snake.pop();
    }

    draw();
}

function endGame(text){

    clearInterval(gameLoop);

    gameEnded = true;

    message = text;

    draw();

    document
        .getElementById(
            "resetBtn"
        )
        .style.display =
            "block";
}

document
.getElementById(
    "resetBtn"
)
.onclick =
    ()=>location.reload();

document.addEventListener(
    "keydown",
    e=>{

        if(
            e.key==="ArrowUp" &&
            dy===0
        ){
            dx=0;
            dy=-1;
        }

        if(
            e.key==="ArrowDown" &&
            dy===0
        ){
            dx=0;
            dy=1;
        }

        if(
            e.key==="ArrowLeft" &&
            dx===0
        ){
            dx=-1;
            dy=0;
        }

        if(
            e.key==="ArrowRight" &&
            dx===0
        ){
            dx=1;
            dy=0;
        }
    }
);

let startX = 0;
let startY = 0;

canvas.addEventListener(
    "touchstart",
    e=>{
        startX =
            e.touches[0].clientX;

        startY =
            e.touches[0].clientY;
    }
);

canvas.addEventListener(
    "touchend",
    e=>{

        const x =
            e.changedTouches[0]
            .clientX;

        const y =
            e.changedTouches[0]
            .clientY;

        const mx =
            x-startX;

        const my =
            y-startY;

        if(
            Math.abs(mx) >
            Math.abs(my)
        ){

            if(mx>0 && dx===0){
                dx=1;
                dy=0;
            }

            if(mx<0 && dx===0){
                dx=-1;
                dy=0;
            }
        }
        else{

            if(my>0 && dy===0){
                dx=0;
                dy=1;
            }

            if(my<0 && dy===0){
                dx=0;
                dy=-1;
            }
        }
    }
);

draw();

gameLoop =
    setInterval(
        update,
        180
    );

</script>
